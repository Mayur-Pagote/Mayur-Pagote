name: Update GitHub Stats

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push updated SVGs to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Stats SVGs
        run: python scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update LeetCode Gist
        run: python scripts/update_leetcode_gist.py
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          LEETCODE_GIST_ID: ${{ secrets.LEETCODE_GIST_ID }}

      - name: Update Weather & Status Gist
        run: python scripts/update_weather_gist.py
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          WEATHER_GIST_ID: ${{ secrets.WEATHER_GIST_ID }}

      - name: Update Random Wall Gist
        run: python scripts/update_random_wall.py
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          RANDOM_WALL_GIST_ID: ${{ secrets.RANDOM_WALL_GIST_ID }}

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --staged --quiet || (git commit -m "chore(stats): auto-update stats cards [skip ci]" && git push)
